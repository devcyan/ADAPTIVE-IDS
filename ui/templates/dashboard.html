<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>ADAPTIVE-IDS</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/dashboard.css') }}"
    >

</head>


<body>

<div class="container">

    <!-- Header -->

    <header>

        <h1>ADAPTIVE-IDS</h1>

        <p>Intrusion Detection System</p>

        <span class="status">
            ● IDS ONLINE
        </span>

    </header>


    <!-- Traffic Overview -->

    <section>

        <h2 class="section-title">
            Traffic Overview
        </h2>

        <div class="stats">

            <div class="card">
                <h3>Packets Captured</h3>
                <p id="packets">0</p>
            </div>

            <div class="card">
                <h3>TCP Packets</h3>
                <p id="tcp">0</p>
            </div>

            <div class="card">
                <h3>UDP Packets</h3>
                <p id="udp">0</p>
            </div>

            <div class="card">
                <h3>ICMP Packets</h3>
                <p id="icmp">0</p>
            </div>

            <div class="card">
                <h3>ARP Packets</h3>
                <p id="arp">0</p>
            </div>

            <div class="card">
                <h3>Other Packets</h3>
                <p id="other">0</p>
            </div>

        </div>

    </section>


    <!-- Security Alerts -->

    <section>

        <h2 class="section-title">
            Security Alerts
        </h2>

        <div class="table-container">

            <div class="alert-log">

                <table>

                    <thead>

                        <tr>
                            <th>Time</th>
                            <th>Severity</th>
                            <th>Type</th>
                            <th>Source</th>
                            <th>Description</th>
                        </tr>

                    </thead>

                    <tbody id="alert-log"></tbody>

                </table>

            </div>

        </div>

    </section>


    <!-- Live Packet Log -->

    <section>

        <h2 class="section-title">
            Live Packet Log
        </h2>

        <div class="table-container">

            <div class="packet-log">

                <table>

                    <thead>

                        <tr>
                            <th>Time</th>
                            <th>Protocol</th>
                            <th>Source</th>
                            <th>Destination</th>
                            <th>Info</th>
                        </tr>

                    </thead>

                    <tbody id="packet-log"></tbody>

                </table>

            </div>

        </div>

    </section>

</div>


<script>

    // =========================
    // Update Statistics
    // =========================

    async function updateStats() {

        const response =
            await fetch("/api/stats");

        const data =
            await response.json();

        document.getElementById("packets")
            .textContent = data.packets;

        document.getElementById("tcp")
            .textContent = data.tcp;

        document.getElementById("udp")
            .textContent = data.udp;

        document.getElementById("icmp")
            .textContent = data.icmp;

        document.getElementById("arp")
            .textContent = data.arp;

        document.getElementById("other")
            .textContent = data.other;
    }


    // =========================
    // Update Packet Log
    // =========================

    async function updatePackets() {

        const response =
            await fetch("/api/packets");

        const packets =
            await response.json();

        const table =
            document.getElementById("packet-log");

        table.innerHTML = "";

        packets
            .slice()
            .reverse()
            .forEach(packet => {

                const row =
                    document.createElement("tr");

                row.innerHTML = `
                    <td>${packet.time}</td>
                    <td>${packet.protocol}</td>
                    <td>${packet.source}</td>
                    <td>${packet.destination}</td>
                    <td>${packet.info}</td>
                `;

                table.appendChild(row);

            });
    }


    // =========================
    // Update Alerts
    // =========================

    async function updateAlerts() {

        const response =
            await fetch("/api/alerts");

        const alerts =
            await response.json();

        const table =
            document.getElementById("alert-log");

        table.innerHTML = "";

        if (alerts.length === 0) {

            const row =
                document.createElement("tr");

            row.innerHTML = `
                <td colspan="5">
                    No threats detected
                </td>
            `;

            table.appendChild(row);

            return;
        }

        alerts
            .slice()
            .reverse()
            .forEach(alert => {

                const row =
                    document.createElement("tr");

                row.innerHTML = `
                    <td>${alert.time}</td>
                    <td>${alert.severity}</td>
                    <td>${alert.type}</td>
                    <td>${alert.source}</td>
                    <td>${alert.description}</td>
                `;

                table.appendChild(row);

            });
    }


    // Initial update

    updateStats();
    updatePackets();
    updateAlerts();


    // Refresh every second

    setInterval(updateStats, 1000);
    setInterval(updatePackets, 1000);
    setInterval(updateAlerts, 1000);

</script>


</body>

</html>
